# Optional merge file: ecosystem sidecar services for CLIProxyAPI.
#
#   cpa-usage-keeper  — usage persistence + analytics dashboard (Go + SQLite)
#   cpa-manager-plus  — full manager center: request-level monitoring, price
#                       estimation, Codex pool inspection (Go + SQLite + web)
#
# Usage (combine with the base file, and optionally the new-api file):
#   docker compose -f docker-compose.yml -f docker-compose.ecosystem.yaml up -d
#
# Both services are vendored in-repo (cpa-usage-keeper/, cpa-manager-plus/) and
# build from that source; swap the build blocks for the published images if you
# prefer (ghcr.io/willxup/cpa-usage-keeper, seakee/cpa-manager-plus).
services:
  cpa-usage-keeper:
    build:
      context: ./cpa-usage-keeper
    container_name: cpa-usage-keeper
    environment:
      APP_PORT: ${CPA_UK_PORT:-8080}
      # Server-side address Keeper syncs from; service name of the base compose.
      CPA_BASE_URL: ${CPA_BASE_URL:-http://cli-proxy-api:8317}
      # Browser-facing CPA URL; leave empty for same-origin /management.html.
      CPA_PUBLIC_URL: ${CPA_PUBLIC_URL:-}
      LOGIN_PASSWORD: ${CPA_UK_LOGIN_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${CPA_UK_PORT:-8080}:8080"
    volumes:
      - ${CPA_UK_DATA_PATH:-./data/cpa-usage-keeper}:/data
    depends_on:
      - cli-proxy-api
    restart: unless-stopped

  cpa-manager-plus:
    build:
      context: ./cpa-manager-plus
      dockerfile: Dockerfile.manager-server
    container_name: cpa-manager-plus
    environment:
      HTTP_ADDR: 0.0.0.0:18317
      USAGE_DB_PATH: /data/usage.sqlite
      CPA_MANAGER_DATA_KEY_PATH: /data/data.key
      # Optional: stable admin key; otherwise the first-start log prints one.
      CPA_MANAGER_ADMIN_KEY: ${CPA_MANAGER_ADMIN_KEY:-}
      USAGE_COLLECTOR_MODE: ${CPA_MANAGER_COLLECTOR_MODE:-auto}
      USAGE_CORS_ORIGINS: ${CPA_MANAGER_CORS_ORIGINS:-*}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${CPA_MANAGER_PORT:-18317}:18317"
    volumes:
      - ${CPA_MANAGER_DATA_PATH:-./data/cpa-manager-plus}:/data
    depends_on:
      - cli-proxy-api
    restart: unless-stopped
